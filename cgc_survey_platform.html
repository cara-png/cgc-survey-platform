// ════════════════════════════════════════════════════════════════
// ROOT APP
// ════════════════════════════════════════════════════════════════
function App() {
  const [view, setView]       = useState("home");
  const [survey, setSurvey]   = useState(null);
  const [responses, setResponses] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [liveSection, setLiveSection] = useState(0);
  const [sheetsUrl, setSheetsUrl] = useState("");

  const openTemplate = (tpl) => {
    const s = clone(tpl);
    s.id = uid();
    setSurvey(s);
    setView("builder");
  };

  const goPreview = () => {
    setResponses({});
    setSubmitted(false);
    setLiveSection(0);
    setView("preview");
  };

  if (view === "home")    return <Home onOpen={openTemplate} />;
  if (view === "builder") return <Builder survey={survey} setSurvey={setSurvey} onPreview={goPreview} onHome={()=>setView("home")} sheetsUrl={sheetsUrl} setSheetsUrl={setSheetsUrl} />;
  if (view === "preview") return <LiveSurvey survey={survey} responses={responses} setResponses={setResponses} submitted={submitted} setSubmitted={setSubmitted} sec={liveSection} setSec={setLiveSection} onBack={()=>setView("builder")} onResults={()=>setView("results")} sheetsUrl={sheetsUrl} />;
  if (view === "results") return <Results survey={survey} responses={responses} onBack={()=>setView("builder")} />;
}

// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════

      <div style={{background:C.forest,padding:"36px 48px 32px",position:"relative",overflow:"hidden"}}>

        <div style={{position:"absolute",bottom:-60,left:"30%",width:200,height:200,borderRadius:"50%",background:"rgba(200,137,90,.08)"}}/>
        <div style={{maxWidth:900,margin:"0 auto",position:"relative"}}>

          ].map(([n,h,b],i)=>(

function TemplateCard({tpl,onClick}) {
  const [hover,setHover] = useState(false);
  const sectionCount = tpl.sections.length;
  const qCount = tpl.sections.reduce((a,s)=>a+s.questions.length,0);
  return (
    <div onClick={onClick}
      onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{...s.card,cursor:"pointer",transition:"all .15s",
        borderColor:hover?tpl.accent:C.border,
        transform:hover?"translateY(-2px)":"none",
        boxShadow:hover?"0 4px 16px rgba(0,0,0,.08)":"none"}}>
      <div style={{width:"100%",height:4,background:tpl.accent,borderRadius:2,marginBottom:16}}/>
      <div style={{fontSize:15,fontWeight:700,color:C.ink,marginBottom:6}}>{tpl.name}</div>
      <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:14}}>{tpl.description}</div>
      <div style={{fontSize:11,color:tpl.accent,fontWeight:600}}>
        {tpl.id==="blank"?"Build from scratch →":`${sectionCount} sections · ${qCount} questions · Use template →`}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// BUILDER
// ════════════════════════════════════════════════════════════════
function Builder({ survey, setSurvey, onPreview, onHome, sheetsUrl, setSheetsUrl }) {
  const [activeSec, setActiveSec] = useState(0);
  const [tab, setTab] = useState("questions"); // questions | settings

  const sec = survey.sections[activeSec] || survey.sections[0];

  const upd = (path,val) => setSurvey(prev=>{
    const s=clone(prev); const parts=path.split(".");
    let o=s; for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
    o[parts[parts.length-1]]=val; return s;
  });
  const updSec = (k,v) => setSurvey(prev=>{const s=clone(prev);s.sections[activeSec][k]=v;return s;});
  const updQ   = (qi,k,v) => setSurvey(prev=>{const s=clone(prev);s.sections[activeSec].questions[qi][k]=v;return s;});

  const addQ = (type) => setSurvey(prev=>{
    const s=clone(prev);
    s.sections[activeSec].questions.push({id:uid(),type,text:"",required:false,
      ...( ["radio","checkbox"].includes(type)?{options:["Option A","Option B","Option C"]}:{} )});
    return s;
  });
  const delQ = (qi) => setSurvey(prev=>{const s=clone(prev);s.sections[activeSec].questions.splice(qi,1);return s;});
  const moveQ = (qi,d) => setSurvey(prev=>{
    const s=clone(prev); const qs=s.sections[activeSec].questions;
    const ni=qi+d; if(ni<0||ni>=qs.length)return s;
    [qs[qi],qs[ni]]=[qs[ni],qs[qi]]; return s;
  });
  const addSec = () => {
    setSurvey(prev=>{
      const s=clone(prev); const n=s.sections.length+1;
      s.sections.push({id:uid(),title:`Section ${n}`,tag:`Section ${n}`,desc:"",questions:[]});
      return s;
    });
    setActiveSec(survey.sections.length);
  };
  const delSec = (i) => {
    if(survey.sections.length===1)return;
    setSurvey(prev=>{const s=clone(prev);s.sections.splice(i,1);return s;});
    setActiveSec(Math.max(0,activeSec-1));
  };
  const addOpt = (qi) => setSurvey(prev=>{const s=clone(prev);s.sections[activeSec].questions[qi].options.push(`Option ${s.sections[activeSec].questions[qi].options.length+1}`);return s;});
  const updOpt = (qi,oi,v) => setSurvey(prev=>{const s=clone(prev);s.sections[activeSec].questions[qi].options[oi]=v;return s;});
  const delOpt = (qi,oi) => setSurvey(prev=>{const s=clone(prev);s.sections[activeSec].questions[qi].options.splice(oi,1);return s;});

  return (
    <div style={{minHeight:"100vh",background:"#EDEAE5",display:"flex",flexDirection:"column"}}>
      {/* topbar */}
      <div style={{background:C.forest,height:52,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <button onClick={onHome} style={{...s.btn("secondary","sm"),color:"rgba(200,217,210,.8)",borderColor:"rgba(200,217,210,.25)"}}>← Home</button>
          <div style={{width:1,height:22,background:"rgba(255,255,255,.12)"}}/>
          <input value={survey.name||""} onChange={e=>upd("name",e.target.value)} placeholder="Survey name…"
            style={{background:"transparent",border:"none",outline:"none",color:C.white,fontSize:14,fontWeight:600,fontFamily:"inherit",width:280}} />
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setTab(tab==="settings"?"questions":"settings")}
            style={{...s.btn("secondary","sm"),color:"rgba(200,217,210,.8)",borderColor:"rgba(200,217,210,.25)"}}>
            {tab==="settings"?"← Questions":"⚙ Settings"}
          </button>
          <button onClick={onPreview} style={{...s.btn("secondary","sm"),color:"rgba(200,217,210,.8)",borderColor:"rgba(200,217,210,.25)"}}>▶ Preview Survey</button>
        </div>
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* sidebar */}
        <div style={{width:214,background:C.white,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",flexShrink:0}}>
          <div style={{padding:"12px 16px 8px",fontSize:10,fontWeight:700,letterSpacing:1.5,color:C.muted,textTransform:"uppercase"}}>Sections</div>
          <div style={{flex:1,overflowY:"auto"}}>
            {survey.sections.map((sec,i)=>(
              <div key={sec.id} onClick={()=>{setActiveSec(i);setTab("questions");}} style={{
                padding:"9px 14px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",
                borderLeft:i===activeSec?`3px solid ${C.sage}`:"3px solid transparent",
                background:i===activeSec?C.cream:"transparent",
                transition:"all .12s",
              }}>
                <span style={{fontSize:13,fontWeight:i===activeSec?600:400,color:i===activeSec?C.forest:C.ink,
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>
                  {sec.title||`Section ${i+1}`}
                </span>
                <span style={{fontSize:11,color:C.muted,flexShrink:0,marginLeft:4}}>({sec.questions.length})</span>
              </div>
            ))}
          </div>
          <div style={{padding:12,borderTop:`1px solid ${C.border}`}}>
            <button onClick={addSec} style={{...s.btn("ghost","sm"),width:"100%"}}>+ Add Section</button>
          </div>
        </div>

        {/* main */}
        <div style={{flex:1,overflowY:"auto",padding:"24px 28px"}}>

          {/* SETTINGS TAB */}
          {tab==="settings" && (
            <div>
              <div style={{fontSize:16,fontWeight:700,color:C.forest,marginBottom:20}}>Survey Settings</div>
              <div style={{...s.card,marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:700,color:C.muted,letterSpacing:.5,textTransform:"uppercase",marginBottom:14}}>Client & Engagement</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
                  <div>
                    <label style={s.label}>Client Name</label>
                    <input style={s.input} value={survey.clientName||""} onChange={e=>upd("clientName",e.target.value)} placeholder="e.g. Abiqua School"/>
                  </div>
                  <div>
                    <label style={s.label}>Engagement Name</label>
                    <input style={s.input} value={survey.engagementName||""} onChange={e=>upd("engagementName",e.target.value)} placeholder="e.g. Faculty Culture Listening Initiative"/>
                  </div>
                </div>
                <div style={{marginBottom:14}}>
                  <label style={s.label}>Intro Text (shown to respondents)</label>
                  <textarea style={{...s.input,minHeight:72,resize:"vertical"}} value={survey.intro||""} onChange={e=>upd("intro",e.target.value)}/>
                </div>
                <div>
                  <label style={s.label}>Confidentiality Note</label>
                  <input style={s.input} value={survey.confidentialityNote||""} onChange={e=>upd("confidentialityNote",e.target.value)}/>
                </div>
              </div>

              <div style={{...s.card,marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:700,color:C.muted,letterSpacing:.5,textTransform:"uppercase",marginBottom:14}}>Google Sheets Integration</div>
                <div style={{marginBottom:10}}>
                  <label style={s.label}>Apps Script Web App URL</label>
                  <input style={s.input} value={sheetsUrl} onChange={e=>setSheetsUrl(e.target.value)} placeholder="https://script.google.com/macros/s/…/exec"/>
                </div>
                <div style={{fontSize:12,color:C.muted,lineHeight:1.7,background:C.cream,borderRadius:6,padding:"12px 14px"}}>
                  <strong style={{color:C.forest}}>One-time setup (≈5 min):</strong><br/>
                  1. Create a Google Sheet for this engagement.<br/>
                  2. Go to <strong>Extensions → Apps Script</strong> and paste the code below.<br/>
                  3. Click <strong>Deploy → New deployment → Web App → Anyone → Deploy</strong>.<br/>
                  4. Copy the Web App URL and paste it above.<br/>
                  Each survey submission will automatically append a row to your sheet.
                </div>
                <details style={{marginTop:12}}>
                  <summary style={{fontSize:12,fontWeight:600,color:C.forest,cursor:"pointer",userSelect:"none"}}>Show Apps Script code to paste</summary>
                  <pre style={{fontSize:11,background:"#1A1A1A",color:"#C8D9D2",padding:"14px 16px",borderRadius:6,marginTop:8,overflowX:"auto",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{`function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSheet();
  var data  = JSON.parse(e.postData.contents);
  var row   = [new Date()];
  Object.values(data).forEach(function(v) {
    row.push(Array.isArray(v) ? v.join(", ") : v);
  });
  sheet.appendRow(row);
  return ContentService
    .createTextOutput(JSON.stringify({ status: "ok" }))
    .setMimeType(ContentService.MimeType.JSON);
}`}</pre>
                </details>
              </div>
            </div>
          )}

          {/* QUESTIONS TAB */}
          {tab==="questions" && (
            <div>
              {/* section meta */}
              <div style={{...s.card,marginBottom:14,borderLeft:`3px solid ${C.sage}`}}>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                    <div>
                      <label style={s.label}>Section Title</label>
                      <input style={s.input} value={sec.title||""} onChange={e=>updSec("title",e.target.value)} placeholder="e.g. Trust & Safety"/>
                    </div>
                    <div>
                      <label style={s.label}>Eyebrow / Tag</label>
                      <input style={s.input} value={sec.tag||""} onChange={e=>updSec("tag",e.target.value)} placeholder="e.g. Section 2"/>
                    </div>
                    <div style={{gridColumn:"1/-1"}}>
                      <label style={s.label}>Section Description</label>
                      <input style={s.input} value={sec.desc||""} onChange={e=>updSec("desc",e.target.value)} placeholder="e.g. Rate your agreement. 1 = Strongly Disagree · 5 = Strongly Agree."/>
                    </div>
                  </div>
                  {survey.sections.length>1 &&
                    <button onClick={()=>delSec(activeSec)} style={{...s.btn("secondary","sm"),color:C.red,borderColor:C.red,marginTop:18,flexShrink:0}}>Remove Section</button>
                  }
                </div>
              </div>

              {/* question cards */}
              {sec.questions.map((q,qi)=>(
                <QCard key={q.id} q={q} qi={qi} total={sec.questions.length}
                  onUpdate={(k,v)=>updQ(qi,k,v)}
                  onDelete={()=>delQ(qi)}
                  onMove={d=>moveQ(qi,d)}
                  onAddOpt={()=>addOpt(qi)}
                  onUpdOpt={(oi,v)=>updOpt(qi,oi,v)}
                  onDelOpt={oi=>delOpt(qi,oi)}
                />
              ))}

              {sec.questions.length===0 &&
                <div style={{textAlign:"center",padding:"48px 24px",color:C.muted,fontSize:14}}>
                  No questions yet. Add one below.
                </div>
              }

              {/* add question row */}
              <div style={{...s.card,marginTop:8}}>
                <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:C.muted,textTransform:"uppercase",marginBottom:12}}>Add a Question</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {QTYPES.map(qt=>(
                    <button key={qt.id} onClick={()=>addQ(qt.id)} style={s.btn("secondary","sm")}>{qt.label}</button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Question Editor Card ──────────────────────────────────────────
function QCard({ q, qi, total, onUpdate, onDelete, onMove, onAddOpt, onUpdOpt, onDelOpt }) {
  const [open, setOpen] = useState(true);
  const qt = QTYPES.find(t=>t.id===q.type);
  return (
    <div style={{...s.card,marginBottom:10,borderLeft:`2px solid ${C.border}`,transition:"border .15s"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:11,background:C.cream,padding:"2px 8px",borderRadius:4,color:C.muted,fontWeight:600,flexShrink:0,whiteSpace:"nowrap"}}>{qt?.short}</span>
        <div style={{flex:1,fontSize:13,color:open?C.muted:C.ink,fontWeight:open?400:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {q.text||<em style={{color:C.muted}}>Untitled question</em>}
        </div>
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          <button onClick={()=>onMove(-1)} disabled={qi===0} style={{...s.btn("secondary","sm"),padding:"4px 7px",opacity:qi===0?.3:1}}>↑</button>
          <button onClick={()=>onMove(1)} disabled={qi===total-1} style={{...s.btn("secondary","sm"),padding:"4px 7px",opacity:qi===total-1?.3:1}}>↓</button>
          <button onClick={()=>setOpen(!open)} style={{...s.btn("secondary","sm"),padding:"4px 9px"}}>{open?"▲":"▼"}</button>
          <button onClick={onDelete} style={{...s.btn("secondary","sm"),padding:"4px 7px",color:C.red,borderColor:C.red}}>✕</button>
        </div>
      </div>

      {open && (
        <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:12}}>
          <div>
            <label style={s.label}>Question Text</label>
            <textarea style={{...s.input,minHeight:58,resize:"vertical"}} value={q.text} onChange={e=>onUpdate("text",e.target.value)} placeholder="Enter your question…"/>
          </div>
          {["radio","checkbox"].includes(q.type) && (
            <div>
              <label style={s.label}>Answer Options</label>
              {(q.options||[]).map((opt,oi)=>(
                <div key={oi} style={{display:"flex",gap:8,marginBottom:6}}>
                  <input style={s.input} value={opt} onChange={e=>onUpdOpt(oi,e.target.value)} placeholder={`Option ${oi+1}`}/>
                  {q.options.length>2 && <button onClick={()=>onDelOpt(oi)} style={{...s.btn("secondary","sm"),padding:"4px 7px",color:C.red,borderColor:C.red,flexShrink:0}}>✕</button>}
                </div>
              ))}
              <button onClick={onAddOpt} style={s.btn("secondary","sm")}>+ Add Option</button>
            </div>
          )}
          <label style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontSize:13,color:C.ink,userSelect:"none"}}>
            <input type="checkbox" checked={q.required} onChange={e=>onUpdate("required",e.target.checked)} style={{accentColor:C.forest,width:14,height:14}}/>
            Required
          </label>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// LIVE SURVEY
// ════════════════════════════════════════════════════════════════
function LiveSurvey({ survey, responses, setResponses, submitted, setSubmitted, sec, setSec, onBack, onResults, sheetsUrl }) {
  const [submitting, setSubmitting] = useState(false);
  const total = survey.sections.length;
  const section = survey.sections[sec];

  const setR = (qid,val) => setResponses(prev=>({...prev,[qid]:val}));
  const toggleCb = (qid,val) => setResponses(prev=>{
    const cur=prev[qid]||[];
    return {...prev,[qid]:cur.includes(val)?cur.filter(v=>v!==val):[...cur,val]};
  });

  const canAdvance = () => section.questions.filter(q=>q.required).every(q=>{
    const r=responses[q.id];
    if(q.type==="checkbox") return r&&r.length>0;
    return r!==undefined&&r!==""&&r!==null;
  });

  const handleSubmit = async () => {
    setSubmitting(true);
    if(sheetsUrl){
      try {
        await fetch(sheetsUrl,{method:"POST",mode:"no-cors",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({survey:survey.name,...responses})});
      } catch(e){}
    }
    setSubmitted(true);
    setSubmitting(false);
  };

  if(submitted) return (
    <div style={{minHeight:"100vh",background:C.cream,display:"flex",alignItems:"center",justifyContent:"center",padding:40}}>
      <div style={{textAlign:"center",maxWidth:480}}>
        <div style={{width:68,height:68,background:C.mist,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 22px",fontSize:30}}>✓</div>
        <h2 style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:28,color:C.forest,marginBottom:12}}>Thank you for sharing.</h2>
        <p style={{fontSize:15,color:C.muted,lineHeight:1.75,marginBottom:10}}>Your response has been recorded. Every perspective — honest, hopeful, or complicated — makes this work more meaningful.</p>
        <p style={{fontSize:14,color:C.muted,lineHeight:1.7}}>Results will be shared with leadership in an anonymized summary. Your individual responses remain confidential.</p>
        <div style={{marginTop:28,display:"flex",gap:12,justifyContent:"center"}}>
          <button onClick={onBack} style={s.btn("secondary")}>← Back to Builder</button>
          <button onClick={onResults} style={s.btn("primary")}>View Results →</button>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:C.cream}}>
      {/* preview banner */}
      <div style={{background:C.warm,padding:"8px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:12,fontWeight:600,color:C.white}}>▶ Preview Mode — this is exactly what respondents will see</span>
        <button onClick={onBack} style={{...s.btn("secondary","sm"),color:C.white,borderColor:"rgba(255,255,255,.35)"}}>← Edit</button>
      </div>

      {/* header */}
      <div style={{background:C.forest,padding:"40px 40px 36px",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-60,right:-60,width:260,height:260,borderRadius:"50%",background:"rgba(107,140,122,.15)"}}/>
        <div style={{maxWidth:680,margin:"0 auto",position:"relative"}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:3,color:C.mist,textTransform:"uppercase",marginBottom:10}}>
            {survey.engagementName||"Listening Initiative"}
          </div>
          <h1 style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:28,color:C.white,fontWeight:600,lineHeight:1.25,marginBottom:8}}>
            {survey.clientName||"Survey"}<br/>
            <em style={{fontStyle:"italic",fontWeight:400,color:C.mist,fontSize:24}}>{survey.name}</em>
          </h1>
          {survey.intro && <p style={{fontSize:14,color:"rgba(200,217,210,.85)",marginTop:10,lineHeight:1.7,maxWidth:520}}>{survey.intro}</p>}
          {survey.confidentialityNote && (
            <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(200,217,210,.15)",color:C.mist,fontSize:12,fontWeight:600,padding:"6px 14px",borderRadius:4,marginTop:14}}>
              🔒 {survey.confidentialityNote}
            </div>
          )}
        </div>
      </div>

      {/* progress */}
      <div style={{maxWidth:680,margin:"0 auto",padding:"18px 40px 6px"}}>
        <div style={{height:4,background:C.sand,borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${((sec+1)/total)*100}%`,background:C.sage,borderRadius:2,transition:"width .4s"}}/>
        </div>
        <div style={{fontSize:11,color:C.muted,marginTop:6}}>Section {sec+1} of {total}</div>
      </div>

      {/* section body */}
      <div style={{maxWidth:680,margin:"0 auto",padding:"18px 40px 32px"}}>
        <div style={{borderLeft:`3px solid ${C.sage}`,paddingLeft:16,marginBottom:28}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:2.5,textTransform:"uppercase",color:C.sage,marginBottom:4}}>{section.tag}</div>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:22,fontWeight:600,color:C.forest}}>{section.title}</div>
          {section.desc && <div style={{fontSize:13,color:C.muted,marginTop:6,lineHeight:1.65}}>{section.desc}</div>}
        </div>

        {section.questions.map(q=>(
          <QRenderer key={q.id} q={q} value={responses[q.id]} onChange={v=>setR(q.id,v)} onToggle={v=>toggleCb(q.id,v)}/>
        ))}
        {section.questions.length===0 && <div style={{textAlign:"center",padding:40,color:C.muted,fontSize:14}}>This section has no questions yet.</div>}
      </div>

      {/* nav */}
      <div style={{maxWidth:680,margin:"0 auto",padding:"0 40px 48px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <button onClick={()=>setSec(s=>s-1)} disabled={sec===0} style={{...s.btn("secondary"),opacity:sec===0?.4:1}}>← Back</button>
        {sec<total-1
          ? <button onClick={()=>setSec(s=>s+1)} disabled={!canAdvance()} style={{...s.btn("primary"),opacity:canAdvance()?1:.5}}>Next →</button>
          : <button onClick={handleSubmit} disabled={!canAdvance()||submitting} style={{...s.btn("primary"),opacity:canAdvance()?1:.5}}>
              {submitting?"Submitting…":"Submit Survey ✓"}
            </button>
        }
      </div>
    </div>
  );
}

// ── Question Renderer ─────────────────────────────────────────────
function QRenderer({ q, value, onChange, onToggle }) {
  return (
    <div style={{marginBottom:28,paddingBottom:26,borderBottom:`1px solid ${C.border}`}}>
      <div style={{fontSize:14.5,fontWeight:500,color:C.ink,marginBottom:14,lineHeight:1.5}}>
        {q.text||<em style={{color:C.muted}}>Untitled question</em>}
        {q.required&&<span style={{color:C.warm,marginLeft:3}}>*</span>}
        {!q.required&&<span style={{fontSize:12,color:C.muted,fontStyle:"italic",marginLeft:8,fontWeight:400}}>(optional)</span>}
      </div>

      {(q.type==="likert5"||q.type==="rating") && (
        <div>
          {q.type==="likert5" && (
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.muted,fontWeight:600,marginBottom:8}}>
              <span>Strongly Disagree</span><span>Strongly Agree</span>
            </div>
          )}
          {q.type==="rating" && (
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.muted,fontWeight:600,marginBottom:8}}>
              <span>Very poor</span><span>Excellent</span>
            </div>
          )}
          <div style={{display:"flex",gap:8}}>
            {[1,2,3,4,5].map(n=>(
              <button key={n} onClick={()=>onChange(n)} style={{
                flex:1,padding:"11px 6px",borderRadius:6,
                border:`1.5px solid ${value===n?C.forest:C.border}`,
                background:value===n?C.forest:C.white,
                color:value===n?C.white:C.muted,
                cursor:"pointer",fontWeight:700,fontSize:14,
                transition:"all .12s",fontFamily:"inherit",
              }}>{n}</button>
            ))}
          </div>
        </div>
      )}

      {q.type==="radio" && (
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          {(q.options||[]).map((opt,i)=>(
            <label key={i} style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer"}}>
              <input type="radio" name={q.id} value={opt} checked={value===opt} onChange={()=>onChange(opt)}
                style={{marginTop:3,accentColor:C.forest,width:15,height:15,flexShrink:0}}/>
              <span style={{fontSize:14,color:C.ink,lineHeight:1.5}}>{opt}</span>
            </label>
          ))}
        </div>
      )}

      {q.type==="checkbox" && (
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          {(q.options||[]).map((opt,i)=>(
            <label key={i} style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer"}}>
              <input type="checkbox" checked={(value||[]).includes(opt)} onChange={()=>onToggle(opt)}
                style={{marginTop:2,accentColor:C.forest,width:15,height:15,flexShrink:0}}/>
              <span style={{fontSize:14,color:C.ink,lineHeight:1.5}}>{opt}</span>
            </label>
          ))}
        </div>
      )}

      {q.type==="text" && (
        <textarea value={value||""} onChange={e=>onChange(e.target.value)} placeholder="Share your thoughts…"
          style={{...s.input,minHeight:86,resize:"vertical",lineHeight:1.65}}/>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// RESULTS
// ════════════════════════════════════════════════════════════════
function Results({ survey, responses, onBack }) {
  const totalQ = survey.sections.reduce((a,s)=>a+s.questions.length,0);
  const answered = Object.keys(responses).length;

  return (
    <div style={{minHeight:"100vh",background:"#EDEAE5"}}>
      <div style={{background:C.forest,height:52,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 28px"}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <button onClick={onBack} style={{...s.btn("secondary","sm"),color:"rgba(200,217,210,.8)",borderColor:"rgba(200,217,210,.25)"}}>← Builder</button>
          <span style={{fontSize:14,fontWeight:600,color:C.white}}>{survey.name} — Results Preview</span>
        </div>
        <div style={{fontSize:12,color:C.mist}}>{answered} / {totalQ} questions answered in this preview</div>
      </div>

      <div style={{maxWidth:820,margin:"0 auto",padding:"32px 32px"}}>
        <div style={{background:"#EEF4F1",border:`1px solid ${C.mist}`,borderRadius:8,padding:"14px 18px",marginBottom:24,fontSize:13,color:C.forest,lineHeight:1.65}}>
          <strong>Preview mode:</strong> This shows your single test response. In production, all submissions are aggregated here automatically. Each response also appends a row to your linked Google Sheet.
        </div>

        {survey.sections.map((sec)=>(
          <div key={sec.id} style={{marginBottom:32}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.sage,marginBottom:4}}>{sec.tag}</div>
            <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:20,color:C.forest,marginBottom:16,fontWeight:600}}>{sec.title}</div>

            {sec.questions.map(q=>{
              const r = responses[q.id];
              return (
                <div key={q.id} style={{...s.card,marginBottom:12}}>
                  <div style={{fontSize:13,fontWeight:600,color:C.ink,marginBottom:12,lineHeight:1.4}}>{q.text}</div>

                  {(q.type==="likert5"||q.type==="rating") && (
                    <div>
                      <div style={{display:"flex",gap:6,marginBottom:8}}>
                        {[1,2,3,4,5].map(n=>(
                          <div key={n} style={{flex:1,height:34,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",
                            background:n===r?C.forest:C.sand,color:n===r?C.white:C.muted,fontSize:14,fontWeight:700}}>
                            {n}
                          </div>
                        ))}
                      </div>
                      {r ? <div style={{fontSize:12,color:C.muted}}>Response: <strong style={{color:C.forest}}>{r} / 5</strong></div>
                           : <div style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>No response</div>}
                    </div>
                  )}

                  {q.type==="radio" && (
                    <div>
                      {(q.options||[]).map(opt=>(
                        <div key={opt} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
                          <div style={{height:7,borderRadius:4,transition:"width .3s",
                            background:opt===r?C.forest:C.sand,
                            width:opt===r?Math.min(160,opt.length*3+40):16}}/>
                          <span style={{fontSize:13,color:opt===r?C.forest:C.muted,fontWeight:opt===r?600:400,lineHeight:1.4}}>{opt}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  {q.type==="checkbox" && (
                    <div>
                      {(q.options||[]).map(opt=>{
                        const sel=(r||[]).includes(opt);
                        return (
                          <div key={opt} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
                            <div style={{height:7,borderRadius:4,background:sel?C.sage:C.sand,width:sel?100:16,transition:"width .3s"}}/>
                            <span style={{fontSize:13,color:sel?C.forest:C.muted,fontWeight:sel?600:400}}>{opt}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {q.type==="text" && (
                    <div style={{fontSize:13,color:r?C.ink:C.muted,fontStyle:r?"normal":"italic",
                      background:C.cream,padding:"10px 14px",borderRadius:6,lineHeight:1.7}}>
                      {r||"No response"}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Mount ─────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
